name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Merge queue and main
# runs are keyed by commit, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

# The job names are the ruleset's required status checks, "Database tests"
# included. Rename them only together with the ruleset.
jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:lines
      - run: pnpm check:migrations

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The *.db.test.ts files check SQL against a real Postgres, for example that
  # the SQL capability check (capability-sql.ts) still agrees with can(). Unit
  # tests skip them because TEST_DATABASE_URL is unset there. This job gives
  # them a throwaway database in a service container, applies the migrations,
  # and fails if any of them is skipped.
  db-test:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac # 17.11-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: artifacts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d artifacts_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # A throwaway database that lives only for this job; not a secret.
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/artifacts_test
      DATABASE_URL: postgres://ci:ci@localhost:5432/artifacts_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec vitest run .db.test.ts --reporter=default --reporter=json --outputFile.json=db-test-results.json
      # describe.runIf skips silently without a database, so prove every test ran.
      - name: Check that no database test was skipped
        run: |
          jq -e '.numTotalTests > 0 and .numPendingTests == 0 and .numTodoTests == 0' db-test-results.json > /dev/null || {
            echo "::error::Database tests were skipped or none ran"
            jq '{numTotalTests, numPassedTests, numPendingTests, numTodoTests}' db-test-results.json
            exit 1
          }
          jq -r '.testResults[] | "\(.name | sub(".*/src/"; "src/")): \(.assertionResults | length) tests"' db-test-results.json

  # The build reads no secrets: the database, auth, email, and R2 clients are
  # created on first request, never at build time. Keep it that way. Outside a
  # Vercel production deploy, `pnpm build` skips its migration step.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The gallery shards restore this cache through the `next-cache` anchor,
      # so they always use the same key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &next-cache
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

  # The gallery (Playwright, `pnpm test:e2e`) runs in parallel shards. On one
  # worker its 683 tests took 34 minutes on main in Nov 2026: about 15 each
  # for the phone and desktop projects, seconds for the production checks.
  # Six shards finished in 5 to 8 minutes each (PR #119). Playwright splits
  # whole files in order, balanced by the number of tests that are not
  # skipped, so a shard's time varies with the files it gets. When the slowest
  # shard passes 12 minutes, add numbers to `matrix.shard`; `--shard` takes
  # its total from the matrix.
  #
  # Every shard starts both web servers from playwright.config.ts, including
  # `next build` for the production checks. That build runs while the dev
  # server starts, and with a restored `.next/cache` both servers are up in
  # 35-65 seconds (about 100 cold). A separate job that builds once and hands
  # `.next` to the shards would add its own 45 seconds or more before any
  # shard starts, and the dev server would still have to start, so each
  # shard builds its own.
  e2e:
    name: Component gallery shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Shards take 5-8 minutes; the headroom covers a cold cache.
    timeout-minutes: 25
    strategy:
      # Let every shard finish, so one run shows every failing test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      # `strategy.job-total` counts every matrix combination, so a second
      # matrix key would make each job run a smaller slice and skip tests
      # while staying green. Fail instead.
      - name: Check that shard is the only matrix key
        env:
          MATRIX: ${{ toJSON(matrix) }}
        run: |
          jq -e 'keys == ["shard"]' <<<"$MATRIX" > /dev/null || {
            echo "::error::The gallery matrix must have only the shard key; --shard uses strategy.job-total"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser cache key; fail rather than share one key across versions.
      - name: Read the Playwright version
        id: playwright
        run: |
          version="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          [ -n "$version" ] || { echo "::error::Could not read the Playwright version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # With the browser cached this only installs the system packages.
      - run: pnpm exec playwright install --with-deps chromium
      # Restore only, so six shards do not race to save it; the Build job saves
      # it. The exact key exists only once Build has finished for this commit;
      # before that, restore-keys brings back an earlier commit's cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *next-cache
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # "Component gallery" is the required check. It passes only when every shard
  # passed: a failed, cancelled, or skipped shard fails it. `always()` makes it
  # report even when a shard failed, so it is never skipped (a skipped
  # required check would count as passing).
  e2e-gate:
    name: Component gallery
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every gallery shard passed
        env:
          SHARDS_RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::Component gallery shards did not all pass (result: $SHARDS_RESULT)"
            exit 1
          fi
          echo "Every Component gallery shard passed."

  # Fails a pull request that adds a dependency with a known vulnerability of
  # moderate severity or worse. It only applies to pull requests; on other
  # events the job is skipped, which counts as passing for the merge queue.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
